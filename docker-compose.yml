services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: grocery-rabbitmq
    ports:
      - "5672:5672"     # porta que a aplicação usa
      - "15672:15672"   # painel web
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: grocery-mailpit
    ports:
        - "1025:1025"   # SMTP: a aplicação envia por aqui
        - "8025:8025"   # caixa de entrada no navegador

volumes:
  rabbitmq_data:

